
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taskflow-backend:v1
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/taskflow.db
    volumes:
      - taskflow-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: taskflow-frontend:v1
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  taskflow-data:
    external: true
    name: taskflow-data
