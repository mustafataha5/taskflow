<div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-6">
  @for (stat of stats(); track stat.label) {
    <div class="group relative flex flex-col justify-between overflow-hidden rounded-2xl border border-slate-200/80 bg-white p-4 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-teal-500/40 hover:shadow-md dark:border-slate-800 dark:bg-slate-900 dark:hover:border-teal-500/40">
      
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
          {{ stat.label }}
        </span>
        
        <!-- Icon Container with Dynamic Styling -->
        <div class="flex h-8 w-8 items-center justify-center rounded-xl transition-transform duration-200 group-hover:scale-110"
             [ngClass]="{
               'bg-teal-50 text-teal-600 dark:bg-teal-500/10 dark:text-teal-400': stat.color === 'sky' || stat.color === 'teal',
               'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300': stat.color === 'slate',
               'bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400': stat.color === 'emerald',
               'bg-zinc-100 text-zinc-500 dark:bg-zinc-800 dark:text-zinc-400': stat.color === 'zinc',
               'bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400': stat.color === 'rose' || stat.label === 'Overdue'
             }">
          
          <!-- Dynamic SVG Icons -->
          @switch (stat.icon) {
            @case ('list') {
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
              </svg>
            }
            @case ('clock') {
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            }
            @case ('zap') {
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
            }
            @case ('check') {
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
              </svg>
            }
            @case ('archive') {
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
              </svg>
            }
            @case ('alert-triangle') {
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
            }
          }
        </div>
      </div>
      
      <p class="mt-3 text-2xl font-black tracking-tight text-slate-900 dark:text-white">
        {{ stat.value }}
      </p>
    </div>
  }
</div>
