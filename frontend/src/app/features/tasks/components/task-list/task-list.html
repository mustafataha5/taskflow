
<div class='grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3'>

    @for (task of tasks(); track task.id) {
        <app-task-card [task]="task" (deleteTask)="onDeleteTask($event)" />
    } @empty {
        <div
      class="col-span-full flex flex-col items-center justify-center rounded-2xl border border-dashed border-sky-200 bg-sky-50/50 p-12 text-center dark:border-slate-800 dark:bg-slate-900/50">
      <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#12c1b9]/10 text-[#12c1b9] mb-4">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
    </div>
    <h3 class="text-base font-semibold text-slate-800 dark:text-white">No tasks found</h3>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400 max-w-sm">Get started by creating your first task to
        organize your workflow.</p>
    </div>
}
</div>
