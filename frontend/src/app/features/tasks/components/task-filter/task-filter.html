
<div class="flex flex-col gap-3 xl:flex-row xl:items-end">

  <!-- Status -->
  <div class="min-w-0 flex-1 space-y-1.5">
    <label
      for="task-filter-status"
      class="block text-xs font-semibold text-slate-600 dark:text-slate-300"
    >
      Status
    </label>

    <select
      id="task-filter-status"
      #statusSelect
      [value]="filters().status"
      (change)="updateStatus($any(statusSelect.value))"
      class="w-full rounded-lg border border-slate-200 bg-slate-50
             px-3 py-2 text-sm text-slate-700 outline-none
             focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20
             dark:border-slate-700 dark:bg-slate-800 dark:text-white"
    >
      <option value="all">All Statuses</option>
      <option value="todo">To Do</option>
      <option value="in_progress">In Progress</option>
      <option value="completed">Completed</option>
      <option value="archived">Archived</option>
    </select>
  </div>

  <!-- Priority -->
  <div class="min-w-0 flex-1 space-y-1.5">
    <label
      for="task-filter-priority"
      class="block text-xs font-semibold text-slate-600 dark:text-slate-300"
    >
      Priority
    </label>

    <select
      id="task-filter-priority"
      #prioritySelect
      [value]="filters().priority"
      (change)="updatePriority($any(prioritySelect.value))"
      class="w-full rounded-lg border border-slate-200 bg-slate-50
             px-3 py-2 text-sm text-slate-700 outline-none
             focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20
             dark:border-slate-700 dark:bg-slate-800 dark:text-white"
    >
      <option value="all">All Priorities</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
  </div>

  <!-- Category -->
  <div class="min-w-0 flex-1 space-y-1.5">
    <label
      for="task-filter-category"
      class="block text-xs font-semibold text-slate-600 dark:text-slate-300"
    >
      Category
    </label>

    <select
      id="task-filter-category"
      #categorySelect
      [value]="filters().category"
      (change)="updateCategory($any(categorySelect.value))"
      class="w-full rounded-lg border border-slate-200 bg-slate-50
             px-3 py-2 text-sm text-slate-700 outline-none
             focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20
             dark:border-slate-700 dark:bg-slate-800 dark:text-white"
    >
      <option value="all">All Categories</option>
      <option value="work">Work</option>
      <option value="personal">Personal</option>
      <option value="learning">Learning</option>
      <option value="health">Health</option>
      <option value="finance">Finance</option>
      <option value="other">Other</option>
    </select>
  </div>

  <!-- Reset -->
  <button
    type="button"
    (click)="resetFilters()"
    class="shrink-0 rounded-lg px-3 py-2 text-sm font-medium
           text-slate-500 transition-colors
           hover:bg-teal-50 hover:text-teal-600
           dark:text-slate-400 dark:hover:bg-slate-800"
  >
    Reset
  </button>

</div>
