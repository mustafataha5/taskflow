<div class="mx-auto max-w-3xl py-8">

  @if (error()) {
    <p
      class="mb-4 rounded-lg bg-red-50 p-4 text-sm text-red-600"
      role="alert"
    >
      {{ error() }}
    </p>
  }

  @if (!isEditMode || task()) {
    <app-task-form
      [task]="task()"
      [saving]="saving()"
      (save)="onSave($event)"
    />
  }

</div>
