<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md text-center rounded-3xl border border-sky-100 bg-white p-8 sm:p-10 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    
    <!-- Icon Banner -->
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-sky-50 text-[#12c1b9] dark:bg-slate-800 mb-6 shadow-inner">
      <svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>

    <!-- Title & Description -->
    <span class="text-xs font-semibold uppercase tracking-wider text-[#12c1b9] mb-2 block">404 Error</span>
    <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-2">
      Page Not Found
    </h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-8 leading-relaxed">
      Oops! The page or task you are looking for doesn’t exist, has been removed, or is temporarily unavailable.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <!-- Go Back Button -->
      <button 
        type="button" 
        (click)="goBack()" 
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700 cursor-pointer">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Go Back
      </button>

      <!-- Dashboard Link -->
      <a 
        routerLink="/tasks" 
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-xl bg-[#12c1b9] px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-[#0fae9e] transition-all">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Task Dashboard
      </a>
    </div>

  </div>
</div>
