<div class="flex min-h-dvh flex-col bg-slate-50 dark:bg-slate-950">

  <!-- Global Header -->
  <app-header (menuToggle)="toggleMobileSidebar()" />

  <div class="flex min-h-0 flex-1 relative">

    <!-- Mobile Backdrop -->
    @if (mobileSidebarOpen()) {
      <div 
        aria-hidden="true"
        (click)="closeMobileSidebar()" 
        class="fixed inset-0 top-[72px] z-30 bg-slate-950/50 backdrop-blur-[2px] transition-opacity lg:hidden"
      ></div>
    }

    <!-- Responsive Sidebar -->
    <div 
      id="app-navigation" 
      class="fixed inset-y-0 left-0 z-40 w-64 pt-[72px] transition-transform duration-300 ease-in-out lg:sticky lg:top-0 lg:h-[calc(100dvh-72px)] lg:shrink-0 lg:pt-0 lg:translate-x-0"
      [class.-translate-x-full]="!mobileSidebarOpen()"
      [class.translate-x-0]="mobileSidebarOpen()" 
      [class.lg:w-[72px]]="sidebarCollapsed()"
      [class.lg:w-64]="!sidebarCollapsed()"
    >
      <app-sidebar 
        [collapsed]="sidebarCollapsed()" 
        (toggleCollapse)="toggleSidebar()"
        (navigate)="closeMobileSidebar()" 
      />
    </div>

    <!-- Main Content -->
    <main id="main-content" class="min-w-0 flex-1 px-4 py-6 sm:px-6 lg:px-8">
      <router-outlet />
    </main>

  </div>
</div>
