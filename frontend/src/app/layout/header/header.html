<header
  class="sticky top-0 z-50 flex h-[72px] w-full items-center
         justify-between border-b border-slate-200/80 bg-white/95
         px-4 shadow-sm shadow-slate-900/[0.02] backdrop-blur-xl
         sm:px-6 lg:px-8
         dark:border-slate-800 dark:bg-slate-950/95"
>
  <!-- LEFT: Mobile Menu Button, Logo and Brand -->
  <div class="flex min-w-0 items-center gap-3">

    <!-- Mobile Menu Hamburger Button -->
    <button
      type="button"
      aria-label="Toggle navigation menu"
      (click)="menuToggle.emit()"
      class="flex h-10 w-10 shrink-0 items-center justify-center
             rounded-xl text-slate-600 hover:bg-slate-100
             lg:hidden dark:text-slate-300 dark:hover:bg-slate-800"
    >
      <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Logo -->
    <div
      class="flex h-10 w-10 shrink-0 items-center justify-center
             rounded-xl bg-gradient-to-br from-teal-400
             via-teal-500 to-emerald-600 text-white
             shadow-md shadow-teal-500/25"
    >
      <svg
        class="h-6 w-6"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 12l2 2 4-4" />
        <circle cx="12" cy="12" r="9" />
      </svg>
    </div>

    <!-- Brand Name -->
    <div class="flex flex-col justify-center">
      <span
        class="text-xl font-extrabold leading-tight tracking-tight
               text-slate-900 dark:text-white"
      >
        Task<span class="text-teal-500">Flow</span>
      </span>

      <span
        class="text-[10px] font-medium tracking-widest
               text-slate-400 dark:text-slate-500"
      >
        WORKSPACE
      </span>
    </div>

  </div>

  <!-- CENTER: Search -->
  <div class="mx-4 hidden max-w-md flex-1 md:block lg:mx-8">
    <label for="global-search" class="sr-only">
      Search tasks and projects
    </label>
    <div class="group relative">
      <svg
        class="pointer-events-none absolute left-3.5 top-1/2
               h-4.5 w-4.5 -translate-y-1/2
               text-slate-400 transition-colors
               group-focus-within:text-teal-500"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        stroke-width="2"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-4-4" />
      </svg>
      <input
        id="global-search"
        type="search"
        placeholder="Search tasks, projects..."
        autocomplete="off"
        class="h-10 w-full rounded-xl border border-slate-200
               bg-slate-50/80 py-2 pl-11 pr-4 text-sm
               text-slate-700 outline-none transition-all
               placeholder:text-slate-400
               hover:border-slate-300 hover:bg-white
               focus:border-teal-400 focus:bg-white
               focus:ring-4 focus:ring-teal-500/10
               dark:border-slate-700 dark:bg-slate-900
               dark:text-slate-100 dark:hover:border-slate-600
               dark:focus:border-teal-500"
      />
    </div>
  </div>

  <!-- RIGHT: Actions -->
  <div class="flex shrink-0 items-center gap-2 sm:gap-3">
    <!-- Notifications placeholder -->
    <button
      type="button"
      aria-label="Notifications"
      disabled
      title="Notifications coming soon"
      class="relative flex h-10 w-10 items-center
             justify-center rounded-xl text-slate-400
             opacity-60"
    >
      <svg
        class="h-5 w-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
        <path d="M10 21h4" />
      </svg>
    </button>

    <div class="mx-1 hidden h-8 w-px bg-slate-200 sm:block dark:bg-slate-700"></div>

    <!-- User Profile -->
    <div class="flex items-center gap-3 rounded-xl px-1 py-1">
      <div
        class="flex h-10 w-10 shrink-0 items-center justify-center
               rounded-xl bg-gradient-to-br from-teal-50
               to-emerald-100 text-sm font-bold text-teal-700
               ring-1 ring-teal-200/60
               dark:from-teal-900/40 dark:to-emerald-900/40
               dark:text-teal-300 dark:ring-teal-800"
      >
        MT
      </div>
      <div class="hidden flex-col lg:flex">
        <span class="text-sm font-semibold leading-tight text-slate-800 dark:text-slate-100">
          Workspace
        </span>
        <span class="mt-0.5 text-xs text-slate-400">
          Administrator
        </span>
      </div>
    </div>
  </div>
</header>
